<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Claude Island</title>
<style>
  :root {
    /* Laranja primário do tema escuro do quaint-money (globals.css, --primary). */
    --running: oklch(0.705 0.213 47.604);
    --waiting: #ff9f0a;
    --done: #30d158;
    --accent: var(--running);
    --surface: #000;
    --context-warn: #ffd60a;
    --context-critical: #ff453a;
    --icon-ink: #000; /* traço do check e da exclamação sobre o selo colorido */
    --text: #fff;
    --muted: #a1a1a6;
    --shadow: 0 4px 14px rgba(0, 0, 0, .35);
    /* Botão no padrão do quaint-money: --primary mais escuro com --primary-foreground,
       fixo em todos os estados para o rótulo claro não cair sobre âmbar ou verde. */
    --button: oklch(0.646 0.222 41.116);
    --button-text: oklch(0.98 0.016 73.684);
    /* Verde mais escuro que o do ponto: o rótulo branco precisa de contraste nos dois temas. */
    --done-button: #248a3d;
    /* Curva com leve "overshoot": é o que dá a sensação elástica da ilha. */
    --spring: cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  /* O Electron segue o tema do sistema em tempo real; a ilha acompanha sem reiniciar. */
  @media (prefers-color-scheme: light) {
    :root {
      --running: oklch(0.646 0.222 41.116); /* --primary do tema claro do quaint-money */
      --waiting: #f08c00;
      --done: #248a3d;
      --surface: #fff;
      --context-warn: #c79200;
      --context-critical: #d70015;
      --icon-ink: #fff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      /* Sobre janelas claras a pílula branca some sem um contorno. */
      --shadow: 0 0 0 1px rgba(0, 0, 0, .1), 0 4px 14px rgba(0, 0, 0, .18);
    }
  }
  /* Permite animar a largura entre "abraçar o conteúdo" e o tamanho expandido. */
  :root { interpolate-size: allow-keywords; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body {
    display: flex; justify-content: center; align-items: flex-start; padding-top: 8px;
    font: 15px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text);
  }

  #pill {
    width: max-content; height: 46px; padding: 0 17px;
    background: var(--surface); border-radius: 23px;
    /* Compacta, a pílula abraça o conteúdo: nada de um lado cheio e o outro vazio.
       Expandida, a barra espalha ícone, título e indicadores pela largura toda. */
    display: grid; grid-template-columns: 1fr; grid-template-rows: 46px auto auto;
    align-items: center; overflow: hidden; text-align: center;
    transition: width .45s var(--spring), height .45s var(--spring), border-radius .45s var(--spring),
                opacity .25s, transform .45s var(--spring), box-shadow .3s, background .3s;
    box-shadow: 0 0 0 1px var(--ring), var(--shadow);
    cursor: grab;
  }
  #pill.dragging { cursor: grabbing; }
  #pill[data-state="idle"] { opacity: 0; transform: scale(.6) translateY(-12px); pointer-events: none; }
  #pill[data-state="waiting"] { --accent: var(--waiting); }
  #pill[data-state="done"] { --accent: var(--done); }
  #pill.expanded { width: 400px; height: 104px; border-radius: 30px; }
  #pill.expanded.has-window { height: 148px; }
  /* Com pedido de permissão a altura segue o texto do pedido (até o limite com rolagem). */
  #pill.expanded.has-permission { height: auto; padding-bottom: 16px; }
  /* O contorno pulsa na cor do estado: dá para ler a situação de relance, sem mirar no ponto.
     Quem pede ação pulsa mais rápido; executando é o mais calmo para não cansar. */
  #pill { --ring: color-mix(in srgb, var(--accent) 40%, transparent); --pulse: 2.4s; animation: glow var(--pulse) ease-in-out infinite; }
  #pill[data-state="waiting"] { --pulse: 1.4s; }
  #pill[data-state="done"] { --pulse: 1.8s; }

  /* Ícone de estado: ponto que respira enquanto trabalha; vira selo com check ao concluir
     e com exclamação quando precisa de resposta. */
  /* Dois grupos: quem é a sessão (ícone e título) à esquerda, como ela está (reticências,
     contexto, contador) à direita. O gap é o respiro mínimo entre eles na pílula compacta. */
  #bar { display: flex; justify-content: space-between; align-items: center; gap: 38px; height: 46px; }
  #lead { display: flex; align-items: center; gap: 11px; }
  #dot {
    flex: none; display: grid; place-items: center; width: 14px; height: 14px;
    border-radius: 50%; background: var(--accent); color: var(--icon-ink);
    transition: background .3s, width .3s var(--spring), height .3s var(--spring);
  }
  #dot svg { display: none; width: 14px; height: 14px; }
  #pill[data-state="running"] #dot { animation: breathe 1.1s ease-in-out infinite; }
  #pill:is([data-state="done"], [data-state="waiting"]) #dot { width: 20px; height: 20px; }
  #pill[data-state="done"] #dot .icon-done, #pill[data-state="waiting"] #dot .icon-waiting { display: block; }

  #title { white-space: nowrap; font-weight: 600; }
  #side { display: flex; align-items: center; gap: 11px; }
  #side:not(:has(> :not([hidden]):not(:empty))) { display: none; }
  #dots { display: none; gap: 3px; }
  #pill[data-state="running"] #dots { display: inline-flex; }
  #dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); animation: hop 1.2s ease-in-out infinite; }
  #dots i:nth-child(2) { animation-delay: .15s; }
  #dots i:nth-child(3) { animation-delay: .3s; }
  /* Anel de contexto: quanto da janela a sessão já consumiu. */
  #context { display: flex; align-items: center; gap: 12px; --level: var(--done); }
  #context[hidden] { display: none; }
  #context[data-level="warn"] { --level: var(--context-warn); }
  #context[data-level="critical"] { --level: var(--context-critical); }
  #context svg { width: 20px; height: 20px; transform: rotate(-90deg); }
  #context circle { fill: none; stroke-width: 5.5; }
  #context .track { stroke: color-mix(in srgb, var(--text) 18%, transparent); }
  #context .value { stroke: var(--level); stroke-linecap: round; transition: stroke-dasharray .4s, stroke .3s; }
  #context-number { font-weight: 500; font-variant-numeric: tabular-nums; opacity: .8; }
  #count {
    font-size: 12.5px; color: var(--button-text); background: var(--button);
    border-radius: 11px; padding: 2px 9px; font-weight: 700;
  }
  #count:empty { display: none; }
  /* Ao concluir, a sessão costuma pedir uma olhada: o atalho fica à mão sem precisar do hover.
     Ele ocupa o lugar do contador, que cede a vez enquanto a pílula está compacta. */
  #open-compact {
    display: none; font: inherit; font-size: 13px; font-weight: 600;
    color: #fff; background: var(--done-button);
    border: 0; border-radius: 13px; padding: 5px 14px; cursor: pointer;
  }
  #open-compact:hover { filter: brightness(1.15); }
  #open-compact:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  #pill[data-state="done"].has-window:not(.expanded) #open-compact { display: inline-block; }
  #pill[data-state="done"].has-window:not(.expanded) #count { display: none; }
  /* Concluído é verde por inteiro, inclusive o botão da versão expandida. */
  #pill[data-state="done"] #open { color: #fff; background: var(--done-button); }
  #detail {
    /* width 0 + min-width 100%: ocupa a linha sem alargar a pílula compacta. */
    width: 0; min-width: 100%;
    grid-column: 1 / -1; align-self: start; color: var(--muted); font-size: 12px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    opacity: 0; transition: opacity .2s;
  }
  /* Pedido de permissão: o texto aparece inteiro, quebrando linha e rolando se preciso.
     Nada de reticências: não se aprova um comando cortado. */
  #permission {
    width: 0; min-width: 100%; grid-column: 1 / -1; margin-top: 8px; text-align: left;
    background: color-mix(in srgb, var(--text) 9%, transparent); border-radius: 12px; padding: 8px 6px 8px 12px;
  }
  #permission[hidden] { display: none; }
  #permission-tool { display: block; font-size: 11px; font-weight: 700; color: var(--accent); margin-bottom: 3px; }
  #permission-text {
    font: 12px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--text);
    white-space: pre-wrap; overflow-wrap: anywhere; max-height: 105px; overflow-y: auto; padding-right: 6px;
    cursor: default; scrollbar-width: thin; scrollbar-color: var(--muted) transparent;
  }
  #permission-text:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  #permission-hint { display: block; margin-top: 5px; font-size: 11px; color: var(--muted); }
  #permission-hint[hidden] { display: none; }
  #actions {
    width: 0; min-width: 100%; grid-column: 1 / -1; margin-top: 8px;
    display: flex; justify-content: center; align-items: center; gap: 8px;
    opacity: 0; transition: opacity .2s;
  }
  #actions button {
    font: inherit; font-size: 13px; font-weight: 600; color: var(--button-text); background: var(--button);
    border: 0; border-radius: 17px; padding: 8px 20px; cursor: pointer; transition: filter .15s, opacity .15s;
  }
  #actions button[hidden] { display: none; }
  #actions button:hover:not(:disabled) { filter: brightness(1.15); }
  #actions button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  #actions button:disabled { opacity: .45; cursor: default; }
  /* "Negar" e, havendo pedido, "Abrir sessão" são secundários: só "Permitir" fica preenchido. */
  #actions #deny, #pill.has-permission #open {
    color: var(--text); background: transparent;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text) 35%, transparent);
  }
  #pill.has-permission #open { margin-right: auto; box-shadow: none; color: var(--muted); padding-inline: 4px; }
  /* Fora do estado expandido o botão não existe para o mouse nem para leitor de tela. */
  #pill:not(.expanded.has-window) #open { visibility: hidden; }
  #pill.has-permission:not(.has-window) #open { display: none; }
  #pill.expanded #detail, #pill.expanded #actions { opacity: 1; transition-delay: .15s; }

  @keyframes breathe { 50% { transform: scale(.55); opacity: .5; } }
  @keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }
  @keyframes glow {
    50% { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--accent) 80%, transparent), 0 2px 16px color-mix(in srgb, var(--accent) 50%, transparent); }
  }
  @media (prefers-reduced-motion: reduce) { #pill, #dot, #dots i { animation: none !important; transition: opacity .2s; } }
</style>
</head>
<body>
  <div id="pill" data-state="idle" role="status" aria-live="polite">
    <div id="bar">
    <span id="lead">
    <span id="dot" aria-hidden="true">
      <svg class="icon-done" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5l2.7 2.7L12 5.4"/></svg>
      <svg class="icon-waiting" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 3.6v5.2"/><path d="M8 12.1v.2"/></svg>
    </span>
    <span id="title"></span>
    </span>
    <span id="side">
      <span id="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span id="context" role="img" hidden>
        <svg viewBox="0 0 36 36" aria-hidden="true">
          <circle class="track" cx="18" cy="18" r="15"/>
          <circle class="value" cx="18" cy="18" r="15" pathLength="100"/>
        </svg>
        <span id="context-number" aria-hidden="true"></span>
      </span>
      <span id="count"></span>
      <button id="open-compact" type="button" aria-label="Abrir sessão">Abrir</button>
    </span>
    </div>
    <span id="detail"></span>
    <div id="permission" hidden>
      <span id="permission-tool"></span>
      <pre id="permission-text" tabindex="0" aria-label="Pedido de permissão"></pre>
      <span id="permission-hint" hidden>Role até o fim para poder permitir</span>
    </div>
    <div id="actions">
      <button id="open" type="button">Abrir sessão</button>
      <button id="deny" type="button" hidden>Negar</button>
      <button id="allow" type="button" hidden>Permitir</button>
    </div>
  </div>

<script>
  const pill = document.getElementById('pill');
  const title = document.getElementById('title');
  const count = document.getElementById('count');
  const detail = document.getElementById('detail');
  const context = document.getElementById('context');
  const contextNumber = document.getElementById('context-number');
  const contextValue = context.querySelector('.value');

  const permissionBox = document.getElementById('permission');
  const permissionTool = document.getElementById('permission-tool');
  const permissionText = document.getElementById('permission-text');
  const permissionHint = document.getElementById('permission-hint');
  const allowButton = document.getElementById('allow');
  const denyButton = document.getElementById('deny');

  const TITLES = { running: 'Trabalhando', waiting: 'Precisa de você', done: 'Concluído' };
  // A ilha abre sozinha quando chega um pedido; os botões só valem depois deste tempo na tela,
  // para um clique que já ia para outra janela não virar aprovação. O main.js aplica a mesma
  // regra (PERMISSION_ARM_MS no state.js) e é quem de fato decide.
  const PERMISSION_ARM_MS = 800;
  let current = { state: 'idle' };
  let hovering = false;
  let armedPermissionId = null;
  let answeredPermissionId = null;
  let readPermissionId = null;

  function render() {
    pill.dataset.state = current.state;
    // "Precisa de você" abre sozinho: é o único estado que exige ação.
    // Em "concluído" a pílula não expande no hover: o botão "Abrir" tem de ficar parado sob o mouse.
    const expandsOnHover = hovering && current.state !== 'done';
    pill.classList.toggle('expanded', current.state !== 'idle' && (expandsOnHover || current.state === 'waiting'));
    if (current.state === 'idle') return; // mantém o texto durante o fade de saída
    pill.classList.toggle('has-window', Boolean(current.windowPid));
    title.textContent = TITLES[current.state];
    count.textContent = current.count > 1 ? current.count : '';
    const usage = current.context;
    context.hidden = !usage;
    if (usage) {
      context.dataset.level = usage.level;
      context.setAttribute('aria-label', `Contexto usado: ${usage.percent}%`);
      contextNumber.textContent = `${usage.percent}%`;
      contextValue.style.strokeDasharray = `${usage.percent} 100`;
    }
    detail.textContent = usage
      ? `${current.project} · ${current.detail} · contexto ${usage.percent}%`
      : `${current.project} · ${current.detail}`;

    const permission = current.permission;
    pill.classList.toggle('has-permission', Boolean(permission));
    permissionBox.hidden = allowButton.hidden = denyButton.hidden = !permission;
    if (!permission) return;
    permissionTool.textContent = permission.tool;
    // Regravar o mesmo texto devolveria a rolagem ao topo a cada atualização de estado.
    if (permissionText.textContent !== permission.text) {
      permissionText.textContent = permission.text;
      permissionText.scrollTop = 0;
    }
    // Só se permite o que foi visto inteiro: se o texto não coube, "Permitir" espera a rolagem
    // chegar ao fim. Negar não precisa disso.
    const hiddenBelow = permissionText.scrollHeight - permissionText.scrollTop - permissionText.clientHeight;
    if (permissionText.clientHeight > 0 && hiddenBelow <= 2) readPermissionId = permission.id;
    const wasRead = readPermissionId === permission.id;
    permissionHint.hidden = wasRead;
    // Depois do clique os botões ficam travados até o pedido sair do estado.
    const locked = permission.id !== armedPermissionId || permission.id === answeredPermissionId;
    denyButton.disabled = locked;
    allowButton.disabled = locked || !wasRead;
  }
  permissionText.addEventListener('scroll', render);

  function decide(behavior) {
    if (!current.permission) return;
    answeredPermissionId = current.permission.id;
    window.island.decide(behavior);
    render();
  }
  allowButton.addEventListener('click', () => decide('allow'));
  denyButton.addEventListener('click', () => decide('deny'));

  // Notas diferentes para dar para saber, sem olhar, se é para responder ou se acabou.
  const CHIMES = { waiting: [880, 1175], done: [660, 880] };

  function chime(frequencies) {
    const audio = new AudioContext();
    frequencies.forEach((frequency, index) => {
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      const start = audio.currentTime + index * 0.16;
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(0.12, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.3);
      oscillator.connect(gain).connect(audio.destination);
      oscillator.start(start);
      oscillator.stop(start + 0.3);
    });
    setTimeout(() => audio.close(), 1000);
  }

  // Com uma ilha por monitor, só a que o main indicar toca o aviso.
  window.island.onState((next, shouldChime) => {
    if (shouldChime && next.state !== current.state && CHIMES[next.state]) chime(CHIMES[next.state]);
    const previousPermissionId = current.permission ? current.permission.id : null;
    current = next;
    const permissionId = next.permission ? next.permission.id : null;
    if (permissionId && permissionId !== previousPermissionId) {
      setTimeout(() => { armedPermissionId = permissionId; render(); }, PERMISSION_ARM_MS);
    }
    render();
  });

  for (const id of ['open', 'open-compact']) {
    document.getElementById(id).addEventListener('click', () => window.island.focusSession());
  }

  // A janela deixa o clique atravessar; só a pílula (e o botão dentro dela) captura o mouse.
  function setHovering(isOverPill) {
    hovering = isOverPill;
    window.island.setHover(isOverPill);
    render();
  }
  pill.addEventListener('mouseenter', () => setHovering(true));
  // Rede de segurança: se um mouseenter se perder, o primeiro movimento sobre a pílula corrige.
  pill.addEventListener('mousemove', () => { if (!hovering) setHovering(true); });
  // No meio de um arraste a pílula não pode encolher nem devolver o clique para a janela de trás.
  pill.addEventListener('mouseleave', () => { if (!drag) setHovering(false); });

  // Arraste manual: -webkit-app-region: drag engoliria, no Windows, o hover e o clique no botão.
  // Abaixo deste limiar é clique (ou duplo clique), não arraste.
  const DRAG_THRESHOLD_PX = 4;
  let drag = null;

  pill.addEventListener('pointerdown', (event) => {
    // No texto do pedido o arraste é da barra de rolagem, não da ilha.
    if (event.button !== 0 || event.target.closest('button, #permission')) return;
    // Com a captura os pointermove continuam chegando mesmo se o ponteiro sair da pílula.
    pill.setPointerCapture(event.pointerId);
    drag = { startX: event.screenX, startY: event.screenY, moved: false };
  });

  pill.addEventListener('pointermove', (event) => {
    if (!drag) return;
    // screenX/screenY não mudam quando a janela anda; clientX/clientY andariam junto com ela.
    const deltaX = event.screenX - drag.startX;
    const deltaY = event.screenY - drag.startY;
    if (!drag.moved) {
      if (Math.hypot(deltaX, deltaY) < DRAG_THRESHOLD_PX) return;
      drag.moved = true;
      pill.classList.add('dragging');
    }
    window.island.drag(deltaX, deltaY);
  });

  // Dispara ao soltar o botão e também se o sistema cancelar o gesto.
  pill.addEventListener('lostpointercapture', (event) => {
    if (!drag) return;
    const moved = drag.moved;
    drag = null;
    pill.classList.remove('dragging');
    if (moved) window.island.endDrag();
    // O mouseleave foi ignorado durante o arraste: confere onde o ponteiro terminou.
    const rect = pill.getBoundingClientRect();
    const isOverPill = event.clientX >= rect.left && event.clientX <= rect.right
      && event.clientY >= rect.top && event.clientY <= rect.bottom;
    if (isOverPill !== hovering) setHovering(isOverPill);
  });

  pill.addEventListener('dblclick', (event) => {
    if (event.target.closest('button, #permission')) return;
    window.island.resetPosition();
    // A janela sai de baixo do ponteiro sem gerar mouseleave; sem isto a pílula ficaria
    // expandida e a janela bloqueando cliques até o mouse passar por ela de novo.
    setHovering(false);
  });
</script>
</body>
</html>
