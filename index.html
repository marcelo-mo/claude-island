<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Claude Island</title>
<style>
  :root {
    /* Laranja primário do tema escuro do quaint-money (globals.css, --primary). */
    --running: oklch(0.705 0.213 47.604);
    --waiting: #ff9f0a;
    --done: #30d158;
    --accent: var(--running);
    /* Curva com leve "overshoot": é o que dá a sensação elástica da ilha. */
    --spring: cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body {
    display: flex; justify-content: center; align-items: flex-start; padding-top: 8px;
    font: 13px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff;
  }

  #pill {
    width: 190px; height: 36px; padding: 0 14px;
    background: #000; border-radius: 22px;
    /* Colunas laterais iguais: o título fica no centro da pílula mesmo com o ponto de um
       lado e o contador (que pode nem existir) do outro. */
    display: grid; grid-template-columns: 26px 1fr 26px; grid-template-rows: 36px auto auto;
    column-gap: 8px; align-items: center; overflow: hidden; text-align: center;
    transition: width .45s var(--spring), height .45s var(--spring), border-radius .45s var(--spring),
                opacity .25s, transform .45s var(--spring), box-shadow .3s;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
  }
  #pill[data-state="idle"] { opacity: 0; transform: scale(.6) translateY(-12px); pointer-events: none; }
  #pill[data-state="waiting"] { --accent: var(--waiting); }
  #pill[data-state="done"] { --accent: var(--done); }
  #pill.expanded { width: 400px; height: 88px; border-radius: 30px; }
  #pill.expanded.has-window { height: 124px; }
  #pill[data-state="waiting"] { animation: glow 1.6s ease-in-out infinite; }

  #dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); transition: background .3s; }
  #pill[data-state="running"] #dot { animation: breathe 1.1s ease-in-out infinite; }
  #pill[data-state="waiting"] #dot { animation: breathe .7s ease-in-out infinite; }

  #title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  #count {
    justify-self: end; font-size: 11px; color: #000; background: var(--accent);
    border-radius: 9px; padding: 1px 7px; font-weight: 700;
  }
  #count:empty { visibility: hidden; }
  #detail {
    grid-column: 1 / -1; align-self: start; color: #a1a1a6; font-size: 12px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    opacity: 0; transition: opacity .2s;
  }
  #open {
    grid-column: 1 / -1; justify-self: center; margin-top: 8px;
    font: inherit; font-size: 12px; font-weight: 600; color: #000; background: var(--accent);
    border: 0; border-radius: 14px; padding: 5px 16px; cursor: pointer;
    opacity: 0; transition: opacity .2s, filter .15s;
  }
  #open:hover { filter: brightness(1.15); }
  #open:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  /* Fora do estado expandido o botão não existe para o mouse nem para leitor de tela. */
  #pill:not(.expanded.has-window) #open { visibility: hidden; }
  #pill.expanded #detail, #pill.expanded #open { opacity: 1; transition-delay: .15s; }

  @keyframes breathe { 50% { transform: scale(.55); opacity: .5; } }
  @keyframes glow { 50% { box-shadow: 0 0 0 3px rgba(255, 159, 10, .55), 0 4px 18px rgba(255, 159, 10, .45); } }
  @media (prefers-reduced-motion: reduce) { #pill, #dot { animation: none !important; transition: opacity .2s; } }
</style>
</head>
<body>
  <div id="pill" data-state="idle" role="status" aria-live="polite">
    <span id="dot"></span>
    <span id="title"></span>
    <span id="count"></span>
    <span id="detail"></span>
    <button id="open" type="button">Abrir sessão</button>
  </div>

<script>
  const pill = document.getElementById('pill');
  const title = document.getElementById('title');
  const count = document.getElementById('count');
  const detail = document.getElementById('detail');

  const TITLES = { running: 'Executando', waiting: 'Precisa de você', done: 'Concluído' };
  let current = { state: 'idle' };
  let hovering = false;

  function render() {
    pill.dataset.state = current.state;
    // "Precisa de você" abre sozinho: é o único estado que exige ação.
    pill.classList.toggle('expanded', current.state !== 'idle' && (hovering || current.state === 'waiting'));
    if (current.state === 'idle') return; // mantém o texto durante o fade de saída
    pill.classList.toggle('has-window', Boolean(current.windowPid));
    title.textContent = TITLES[current.state];
    count.textContent = current.count > 1 ? current.count : '';
    detail.textContent = `${current.project} · ${current.detail}`;
  }

  // Notas diferentes para dar para saber, sem olhar, se é para responder ou se acabou.
  const CHIMES = { waiting: [880, 1175], done: [660, 880] };

  function chime(frequencies) {
    const audio = new AudioContext();
    frequencies.forEach((frequency, index) => {
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      const start = audio.currentTime + index * 0.16;
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(0.12, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.3);
      oscillator.connect(gain).connect(audio.destination);
      oscillator.start(start);
      oscillator.stop(start + 0.3);
    });
    setTimeout(() => audio.close(), 1000);
  }

  window.island.onState((next) => {
    if (next.state !== current.state && CHIMES[next.state]) chime(CHIMES[next.state]);
    current = next;
    render();
  });

  document.getElementById('open').addEventListener('click', () => window.island.focusSession());

  // A janela deixa o clique atravessar; só a pílula (e o botão dentro dela) captura o mouse.
  pill.addEventListener('mouseenter', () => { hovering = true; window.island.setHover(true); render(); });
  pill.addEventListener('mouseleave', () => { hovering = false; window.island.setHover(false); render(); });
</script>
</body>
</html>
